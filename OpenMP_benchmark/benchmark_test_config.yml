
name: "Task 2 - Parallelization Strong-Scaling Benchmark"

# Parameters from Worksheet 5, Task 2 (2D scenario)
config:
  delta_time: 0.0005
  total_time: 50
  output_interval: 5
  cell_size: [5, 5, 5]
  domain_min: [0, 0, 0]
  domain_max: [300, 54, 0]
  epsilon: 5.0
  boarderXmin: periodic
  boarderXmax: periodic
  gravityFactor: -12.44
  Initial_temperature: 40
  thermostat_step: 1000
  cut_off: 3.0  # rcutoff = 2.5*sigma, sigma1=1.2 => cutoff=3.0
  output: "OpenMP_benchmark/test_results/MD_vtk"
  parallelization_strategy: 1  # Will be overridden in benchmark script

particles:
  Liquid_1:
    type: cuboid
    position: [0.6, 2.0, 0.0]
    n: [250, 20, 0]
    velocity: [0.0, 0.0, 0.0]
    mass: 1.0
    sigma: 1.2
    dist: 1.2
    epsilon: 1.0
    brownian_sigma: 0.0

  Liquid_2:
    type: cuboid
    position: [0.6, 27.0, 0.0]
    n: [250, 20, 0]
    velocity: [0.0, 0.0, 0.0]
    mass: 2.0
    sigma: 1.1
    dist: 1.2
    epsilon: 1.0
    brownian_sigma: 0.0
