name: Drop in Basin - Main Simulation with Disc

config:
  # Time parameters
  delta_time: 0.0005
  total_time: 40
  output_interval: 200
  output: ../output/drop_simulation_vtk
  
  # Domain parameters - Size L = {303, 180}
  domain_min: [0, 0, 0]
  domain_max: [303, 180, 1]
  cell_size: [3, 3, 3]
  
  # Lennard-Jones parameters
  epsilon: 1.0
  sigma: 1.2
  cut_off: 3.0  # 2.5 * sigma = 2.5 * 1.2 = 3.0
  
  # Gravity: g_grav = -12.44 in y-direction (2D simulation in X-Y plane)
  gravity_force: [0.0, -12.44, 0.0]
  
  # Thermostat disabled for this phase (set interval to 0)
  thermostat_interval: 0
  thermostat_temperature: 0.1
  initial_temperature: 0.1
  
  # Boundary conditions - reflective on all sides
  boarderXmin: "reflect"
  boarderXmax: "reflect"
  boarderYmin: "reflect"
  boarderYmax: "reflect"
  boarderZmin: "reflect"
  boarderZmax: "reflect"
  
  # Use Lennard-Jones force
  attraction: "lennard-jones"
  
  # Load equilibrated state from checkpoint
  checkpoint_input: "../output/equilibrated.chkpt"

particles:
  # Drop (disc) parameters:
  # xs = {150, 150} (center)
  # Adjusted Y position to ensure disc is fully within domain
  # Domain Y: 0-180, Disc radius ~20, so Y should be < 160
  # Rs = 20 (physical radius, adjusted to ~17 particles)
  # Use same parameters as liquid
  drop_disc:
    type: disc
    center: [150, 150, 0.0]
    radius: 17  # Physical radius ~ 17*1.2 = 20.4 units
    dist: 1.2  # h = 1.2, same as liquid
    mass: 1.0
    velocity: [0.0, 0.0, 0.0]  # Initial velocity is zero
    brownian_sigma: 0.0
