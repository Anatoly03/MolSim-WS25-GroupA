name: Rayleigh-Taylor instability in 3D (Periodic Boundaries)

config:
  gravityFactor: -12.44
  delta_time: 0.0005
  total_time: 100

  cell_size: [3, 3, 3]
  domain_min: [0, 0, 0]
  domain_max: [20, 20, 20] # 60, 60, 60

  Initial temperature: 40
  thermostat step: 1000

  output_interval: 200
  output: ../output/drop_periodic_vtk

particles:
  liquid1:
    mass: 1.0
    epsilon: 1.0
    sigma: 1.2
    position: [0.6, 0.6, 0.6]
    velocity: [0.0, 0.0, 0.0]
    n: [50, 20, 50]
    dist: 1.2

  liquid2:
    mass: 2.0
    epsilon: 1.0
    sigma: 1.1
    position: [0.6, 24.6, 0.6]
    velocity: [0.0, 0.0, 0.0]
    n: [50, 20, 50]
    dist: 1.2
