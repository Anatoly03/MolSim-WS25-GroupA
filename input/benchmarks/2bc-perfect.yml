name: Two Body Collision with Perfect Cell Size
benchmarked_on: 28th Nov 2025

config:
  delta_time: 0.0005
  total_time: 1
  cut_off: 3.0
  output_interval: 1000
  cell_size: [3, 3, 3]
  domain_min: [0, 0, 0]
  domain_max: [60, 30, 0] # 3*60 = 180, 3*30 = 90
  epsilon: 5.0
  sigma: 1.0

particles:
  cuboid1:
    type: cuboid
    n: [100, 20, 1]
    position: [20.0, 20.0, 0.0]
    velocity: [0.0, 0.0, 0.0]
    mass: 1.0
    sigma: 1.0
    dist: 1.1225
    brownian_sigma: 0.0000
  cuboid2:
    type: cuboid
    n: [20, 20, 1]
    position: [70.0, 60.0, 0.0]
    velocity: [0.0, -10.0, 0.0]
    mass: 1.0
    sigma: 1.0
    dist: 1.1225
    brownian_sigma: 0.0000
