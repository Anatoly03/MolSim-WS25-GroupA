name: MembraneSimulation

config:
  delta_time: 0.01
  total_time: 500
  output_interval: 5
  cell_size: [5, 5, 5]
  domain_min: [0, 0, 0]
  domain_max: [148,148,148]
  epsilon: 5.0
  gravityFactor: -0.001
  cut_off: 4
  Z-UP constant: 0.8


particles:
  membrane:
    type: membrane
    mass: 1
    epsilon: 1
    sigma: 1
    position: [15,15,15]
    velocity: [0, 0, 0]
    n: [50, 50, 1]
    dist: 2.2
    stiffness: 300
    bond_length: 2.2
